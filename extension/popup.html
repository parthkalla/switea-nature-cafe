<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RoastFuze Sync Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 10px;
      background: #131b2e;
      border: 1px solid #1e293b;
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .dot.green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.orange { background: #f59e0b; }
    .dot.red { background: #ef4444; }
    .badge-status {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: #1e293b;
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-outline {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
      margin-top: 8px;
    }
    .btn-outline:hover { background: #1e293b; }
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">RF</div>
    <div>
      <div class="title">RoastFuze Sync Bridge</div>
      <div class="subtitle">Swiggy & Zomato Realtime POS</div>
    </div>
  </div>

  <div class="status-list">
    <div class="status-item">
      <div>
        <span class="dot" id="rf-dot"></span>
        <strong id="rf-name">RoastFuze Portal</strong>
      </div>
      <span class="badge-status" id="rf-status">Checking...</span>
    </div>

    <div class="status-item">
      <div>
        <span class="dot" id="swiggy-dot"></span>
        <span>Swiggy Partner</span>
      </div>
      <span class="badge-status" id="swiggy-status">Idle</span>
    </div>

    <div class="status-item">
      <div>
        <span class="dot" id="zomato-dot"></span>
        <span>Zomato Merchant</span>
      </div>
      <span class="badge-status" id="zomato-status">Idle</span>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-test-order">
    <span>⚡ Send Test Zomato Order to KDS</span>
  </button>

  <button class="btn btn-outline" id="btn-open-dashboard">
    <span>Open RoastFuze Dashboard</span>
  </button>

  <div class="footer">
    100% Free Direct Sync • No Middleman API Fee
  </div>

  <script src="popup.js"></script>
</body>
</html>
